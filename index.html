<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VersátilCrafts - Loja Freakalhoca</title>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Space Grotesk', sans-serif;
      background-color: #0f0f0f;
      color: #f4f4f4;
    }
    header {
      background: linear-gradient(90deg, #ff0080, #7928ca);
      padding: 1.5rem;
      text-align: center;
      font-family: 'Archivo Black', sans-serif;
      font-size: 1.5rem;
      text-transform: uppercase;
    }
    section.hero {
      padding: 2rem;
      text-align: center;
      background: #1a1a1a;
    }
    section.hero h1 {
      font-size: 2.5rem;
      color: #ff00aa;
    }
    section.hero p {
      font-size: 1.1rem;
      margin-top: 0.5rem;
    }
    .products {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 1.5rem;
      padding: 2rem;
    }
    .product {
      background-color: #222;
      border-radius: 12px;
      padding: 1rem;
      text-align: center;
      transition: 0.2s ease-in-out;
    }
    .product:hover {
      transform: scale(1.02);
      background-color: #2a2a2a;
    }
    .product img {
      max-width: 100%;
      border-radius: 8px;
    }
    .product h3 {
      color: #ff00aa;
      margin: 0.5rem 0;
    }
    .snipcart-add-item {
      background-color: #ff0080;
      color: white;
      border: none;
      padding: 0.7rem 1.2rem;
      font-weight: bold;
      cursor: pointer;
      margin-top: 1rem;
      border-radius: 6px;
    }
    footer {
      background: #0a0a0a;
      padding: 1rem;
      text-align: center;
      font-size: 0.8rem;
      color: #888;
    }
  </style>
</head>
<body>

<header>
  VersátilCrafts™ — Cimento, Cor & Caos
</header>

<section class="hero">
  <h1>Bem-vind@ à loja freakalhoca</h1>
  <p>Cada peça tem atitude. Se procurares algo discreto... azar.</p>
</section>

<section class="products">
  <div class="product">
    <img src="URL_DA_IMAGEM_AQUI" alt="Middle Finger Neon">
    <h3>Middle Finger Neon</h3>
    <p>Decorativo, expressivo, e 100% terapêutico.</p>
    <button 
      class="snipcart-add-item"
      data-item-id="middle-finger-neon"
      data-item-name="Middle Finger Neon"
      data-item-price="12.00"
      data-item-url="/"
      data-item-description="Peça artesanal freakalhoca feita com Jesmonite e amor agressivo."
    >Comprar</button>
  </div>

  <!-- Repetir este bloco para mais produtos -->
</section>

<footer>
  Feito à mão por duas amigas com costas lixadas e talento discutível. | @versatilcrafts
</footer>

<!-- SNIPCART INTEGRATION -->
<script async src="https://cdn.snipcart.com/themes/v3.3.0/default/snipcart.js"></script>
<link rel="stylesheet" href="https://cdn.snipcart.com/themes/v3.3.0/default/snipcart.css" />
<div hidden id="snipcart" data-api-key="AQUI_VAI_TUA_API_KEY_DO_SNIPCART"></div>

</body>
</html>
